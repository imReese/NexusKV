[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "nexuskv"
version = "0.1.0"
description = "NexusKV Model State Intelligence Layer & High-Performance KV Cache Storage Engine"
authors = [{ name = "NexusKV Team" }]
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.scripts]
nexuskv-cli = "nexuskv.cli:main"
nexuskv-locus-bridge = "nexuskv.integrations.locus_bridge:main"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["python/tests"]
python_files = ["test_*.py"]

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">NexusKV architecture</title>
  <desc id="desc">Inference Runtimes connect through adapters to the NexusKV Intelligence Layer, which coordinates a Control Plane and external Data Plane capabilities.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#475569"/>
    </marker>
    <style>
      .title { font: 700 30px Arial, sans-serif; fill: #0f172a; }
      .label { font: 700 19px Arial, sans-serif; fill: #0f172a; }
      .detail { font: 15px Arial, sans-serif; fill: #475569; }
      .box { fill: #f8fafc; stroke: #64748b; stroke-width: 2; rx: 12; }
      .layer { fill: #eef2ff; stroke: #4f46e5; stroke-width: 2.5; rx: 14; }
      .control { fill: #f0fdf4; stroke: #16a34a; stroke-width: 2; rx: 12; }
      .data { fill: #fff7ed; stroke: #ea580c; stroke-width: 2; rx: 12; }
      .arrow { stroke: #475569; stroke-width: 2.2; marker-end: url(#arrow); }
      .feedback { stroke: #475569; stroke-width: 2; stroke-dasharray: 6 6; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1200" height="760" fill="#ffffff"/>
  <text class="title" x="600" y="46" text-anchor="middle">NexusKV Architecture</text>

  <rect class="box" x="120" y="80" width="960" height="90"/>
  <text class="label" x="600" y="112" text-anchor="middle">Inference Runtimes</text>
  <text class="detail" x="600" y="142" text-anchor="middle">vLLM  |  SGLang  |  future adapters</text>

  <rect class="box" x="320" y="205" width="560" height="60"/>
  <text class="label" x="600" y="241" text-anchor="middle">Inference Runtime adapters and versioned State Descriptor contract</text>

  <rect class="layer" x="120" y="305" width="960" height="150"/>
  <text class="label" x="600" y="340" text-anchor="middle">NexusKV Intelligence Layer</text>
  <rect class="box" x="155" y="365" width="165" height="55"/>
  <text class="detail" x="237" y="398" text-anchor="middle">Matcher</text>
  <rect class="box" x="335" y="365" width="165" height="55"/>
  <text class="detail" x="417" y="398" text-anchor="middle">Cost model</text>
  <rect class="box" x="515" y="365" width="165" height="55"/>
  <text class="detail" x="597" y="398" text-anchor="middle">Reuse planner</text>
  <rect class="box" x="695" y="365" width="165" height="55"/>
  <text class="detail" x="777" y="398" text-anchor="middle">Placement policy</text>
  <rect class="box" x="875" y="365" width="165" height="55"/>
  <text class="detail" x="957" y="398" text-anchor="middle">Prefetch</text>

  <rect class="control" x="120" y="515" width="430" height="155"/>
  <text class="label" x="335" y="550" text-anchor="middle">Control Plane</text>
  <text class="detail" x="335" y="585" text-anchor="middle">policy + topology + tenancy</text>
  <text class="detail" x="335" y="613" text-anchor="middle">capability registry + observability</text>
  <text class="detail" x="335" y="641" text-anchor="middle">versioned, off the request Data Plane</text>

  <rect class="data" x="650" y="515" width="430" height="155"/>
  <text class="label" x="865" y="550" text-anchor="middle">Data Plane capabilities</text>
  <text class="detail" x="865" y="585" text-anchor="middle">GPU HBM | host DRAM | SSD</text>
  <text class="detail" x="865" y="613" text-anchor="middle">NIXL | Mooncake | Inference Runtime transfers</text>
  <text class="detail" x="865" y="641" text-anchor="middle">remote memory and object stores</text>

  <line class="arrow" x1="600" y1="170" x2="600" y2="197"/>
  <line class="arrow" x1="600" y1="265" x2="600" y2="297"/>
  <line class="arrow" x1="500" y1="455" x2="380" y2="507"/>
  <line class="arrow" x1="700" y1="455" x2="820" y2="507"/>
  <line class="feedback" x1="865" y1="678" x2="865" y2="710"/>
  <line class="feedback" x1="865" y1="710" x2="600" y2="710"/>
  <line class="feedback" x1="600" y1="710" x2="600" y2="463"/>
  <text class="detail" x="730" y="733" text-anchor="middle">measured completion and cost feedback</text>
</svg>

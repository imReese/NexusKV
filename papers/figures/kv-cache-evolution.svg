<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Evolution of Model State Infrastructure</title>
  <desc id="desc">Five stages from a private KV buffer to a Model State Intelligence Layer.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#475569"/>
    </marker>
    <style>
      .title { font: 700 30px Arial, sans-serif; fill: #0f172a; }
      .label { font: 700 20px Arial, sans-serif; fill: #0f172a; }
      .detail { font: 16px Arial, sans-serif; fill: #475569; }
      .stage { fill: #f8fafc; stroke: #64748b; stroke-width: 2; rx: 14; }
      .future { fill: #eef2ff; stroke: #4f46e5; stroke-width: 2.5; rx: 14; }
      .arrow { stroke: #475569; stroke-width: 2.5; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1200" height="420" fill="#ffffff"/>
  <text class="title" x="600" y="52" text-anchor="middle">Evolution of Model State Infrastructure</text>

  <rect class="stage" x="45" y="130" width="190" height="125"/>
  <text class="label" x="140" y="177" text-anchor="middle">KV Buffer</text>
  <text class="detail" x="140" y="207" text-anchor="middle">one request</text>
  <text class="detail" x="140" y="230" text-anchor="middle">one device</text>

  <rect class="stage" x="275" y="130" width="190" height="125"/>
  <text class="label" x="370" y="177" text-anchor="middle">Paged KV Cache</text>
  <text class="detail" x="370" y="207" text-anchor="middle">allocation</text>
  <text class="detail" x="370" y="230" text-anchor="middle">prefix reuse</text>

  <rect class="stage" x="505" y="130" width="190" height="125"/>
  <text class="label" x="600" y="177" text-anchor="middle">Hierarchy</text>
  <text class="detail" x="600" y="207" text-anchor="middle">GPU / host</text>
  <text class="detail" x="600" y="230" text-anchor="middle">storage tiers</text>

  <rect class="stage" x="735" y="130" width="190" height="125"/>
  <text class="label" x="830" y="177" text-anchor="middle">Distributed Fabric</text>
  <text class="detail" x="830" y="207" text-anchor="middle">cross-worker</text>
  <text class="detail" x="830" y="230" text-anchor="middle">storage + transfer</text>

  <rect class="future" x="965" y="115" width="190" height="155"/>
  <text class="label" x="1060" y="160" text-anchor="middle">Model State</text>
  <text class="label" x="1060" y="186" text-anchor="middle">Intelligence</text>
  <text class="detail" x="1060" y="218" text-anchor="middle">semantics + cost</text>
  <text class="detail" x="1060" y="241" text-anchor="middle">placement + timing</text>

  <line class="arrow" x1="235" y1="193" x2="267" y2="193"/>
  <line class="arrow" x1="465" y1="193" x2="497" y2="193"/>
  <line class="arrow" x1="695" y1="193" x2="727" y2="193"/>
  <line class="arrow" x1="925" y1="193" x2="957" y2="193"/>

  <text class="detail" x="600" y="340" text-anchor="middle">Increasing reuse scope also increases coordination cost.</text>
</svg>

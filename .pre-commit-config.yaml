default_stages: [pre-commit, pre-push, manual]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-symlinks
      - id: destroyed-symlinks
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-toml
      - id: check-ast
      - id: check-added-large-files
        args: ['--maxkb=1500']
      - id: check-merge-conflict
      - id: check-shebang-scripts-are-executable
      - id: detect-private-key
      - id: debug-statements
      - id: no-commit-to-branch
        args: [--branch, main]

  - repo: https://github.com/PyCQA/isort
    rev: 6.0.0
    hooks:
      - id: isort
        files: ^(python/|tools/|tests/)

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.6
    hooks:
      - id: ruff
        args:
          - --select=F401,F821,UP037
          - --fix
        files: ^(python/|tools/|tests/)
        exclude: |
          (?x)^(
          .*/__init__\.py$
          )$

  - repo: https://github.com/psf/black
    rev: 25.1.0
    hooks:
      - id: black
        files: ^(python/|tools/|tests/)

  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v19.1.7
    hooks:
      - id: clang-format
        types_or: [c++, cuda]
        files: ^(csrc/)
        args: [--style=file, --verbose]

  - repo: local
    hooks:
      - id: gofmt-pkg
        name: gofmt pkg/ workspace
        entry: bash -c 'cd pkg && gofmt -s -w .'
        language: system
        files: ^pkg/.*\.go$
        pass_filenames: false

      - id: rustfmt-rust-workspace
        name: rustfmt rust/ workspace
        entry: bash -c 'cd rust && cargo fmt'
        language: system
        files: ^rust/.*\.rs$
        pass_filenames: false

      - id: clippy-rust-workspace
        name: clippy rust/ workspace (auto-fix)
        entry: bash -c 'cd rust && cargo clippy --workspace --fix --allow-dirty --allow-staged && cargo clippy --workspace -- -D warnings'
        language: system
        files: ^rust/.*\.rs$
        pass_filenames: false

      - id: check-chinese-in-en-docs
        name: check chinese characters in english specs
        entry: >-
          python3 -c 'import sys, re; p=re.compile(r"[\u4e00-\u9fff]"); ec=0; [ ([(print(f"{f}:{i+1}: {l.strip()}") or (ec:=1)) for i,l in enumerate(open(f, "r", encoding="utf-8", errors="ignore")) if p.search(l)]) for f in sys.argv[1:] ]; sys.exit(ec)'
        language: system
        files: ^docs/(design|papers|benchmarks)/.*(?<!_cn)\.md$
        types_or: [markdown, text]

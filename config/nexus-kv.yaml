port: "8080"
data_dir: "/opt/nexus-kv/data"
etcd_endpoints:
  - "localhost:2379"

log:
  run_dir: "/var/log/nexus-kv/run"
  backup_dir: "/var/log/nexus-kv/bak"
  level: "info" # 可动态调整 debug/info/warn/error
  max_size: 100 # MB
  max_backups: 30
  max_age: 90   # days

raft:
  election_timeout: "1s"
  heartbeat_timeout: "500ms"
  snapshot_interval: "2h"

storage:
  cache_size: 1024        # 1MB 缓存条目数
  flush_interval: "10s"   # 10s 刷盘间隔
  max_value_size: 1048576 # 1MB 单个value最大字节数

cache_router:
  strategy: "cost_based"  # cost_based / longest_prefix / hit_driven
  load_penalty_weight: 50.0

hbm_pool:
  total_capacity_bytes: 85899345920 # 80 GB HBM Capacity
  block_size_bytes: 16777216       # 16 MB Block Granularity

cluster_sync:
  sync_interval_ms: 10
  lease_ttl_ms: 5000

performance:
  max_connection: 500
  read_timeout: "5s"
  write_timeout: "10s"